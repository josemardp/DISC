version: '3.8'

services:
  # Banco local para desenvolvimento. Producao roda na Vercel + Supabase (ver .env.template).
  # Senha e SECRET_KEY vem do .env (copie .env.template); nenhum valor fixo aqui.
  db:
    image: postgres:15-alpine
    container_name: psycho_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: psycho_database
    # Porta do banco nao e publicada no host: so o backend, na rede do compose, chega nele.
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend (FastAPI Application)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: psycho_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/psycho_database
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Frontend (Vite + Nginx Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psycho_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
